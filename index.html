<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14305C" />

       `npm run build` (VitePWA) y, en dev/preview, `vite.config.js`. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SIGACU" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description"
    content="SIGACU — Sistema de Desarrollo para el Proceso de Informatización de la Universidad de Holguín" />
  <title>SIGACU · Universidad de Holguín</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-surface text-brand-900 antialiased">
  <div id="root"></div>
  <!-- Sólo lo sirve el dev server / preview (vite.config.js): URL pública del
       túnel. `onerror` evita un 404 en consola si se sirve como estáticos. -->
  <script src="/env.js" onerror="this.remove()"></script>
  <script type="module" src="/src/main.jsx"></script>
  <noscript>Active JavaScript para usar SIGACU.</noscript>
